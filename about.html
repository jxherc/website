<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>about — jxherc</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=28">
<meta property="og:title" content="about — jxherc">
<meta property="og:description" content="about jxherc">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main>
  <a class="home" href="index.html">jxherc</a>
  <section>
    <div class="label">about</div>
    <div class="intro-block">
      <div class="prose">
        <p>i'm eric, a high school student in toronto. i build software and design interfaces.</p>
        <p>this site keeps track of what i'm listening to, saving, and making. i'm still exploring computer science and ai; sports take up the rest.</p>
      </div>
      <div class="portrait" style="width:140px;height:185px;flex-shrink:0">
        <div class="fallback">—</div>
        <img src="images/about.png" alt=""
             onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none';"
             onerror="this.style.display='none';" />
      </div>
    </div>
  </section>
  <section class="page-edit-stamp" id="edit-stamp"></section>
</main>
<script>
fetch('https://api.github.com/repos/jxherc/website/commits?path=about.html&per_page=1')
  .then(r => r.json())
  .then(data => {
    const hit = data[0]?.commit;
    if (!hit) return;
    const d = new Date(hit.committer?.date || hit.author?.date);
    if (isNaN(d)) return;
    const when = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }).toLowerCase();
    document.getElementById('edit-stamp').textContent = 'updated ' + when;
  })
  .catch(() => {});
</script>
</body>
</html>
