<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>jxherc</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=29">
<meta name="description" content="jxherc — ui/ux sde guy, toronto">
<meta property="og:title" content="jxherc">
<meta property="og:description" content="a website">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main>

  <header>
    <span class="brand">jxherc<span class="alias">/ jxh</span></span>
  </header>

  <section class="intro-block">
    <div class="intro">
      ui/ux sde guy.
      <span class="location">toronto.</span>
    </div>
    <div class="portrait">
      <div class="fallback">—</div>
      <img src="images/me.jpg" alt="" fetchpriority="high" decoding="async"
           onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none';"
           onerror="this.style.display='none';" />
    </div>
  </section>

  <section>
    <div class="label">about</div>
    <div class="kv-list">
      <div class="kv-row"><span class="k">time</span><span class="v" id="clock">—</span></div>
      <div class="kv-row"><span class="k">age</span><span class="v" id="age">—</span></div>
      <div class="kv-row"><span class="k">languages</span><span class="v">english &nbsp;·&nbsp; mandarin</span></div>
    </div>
  </section>

  <nav class="page-nav" aria-label="site">
    <a href="music.html">music</a>
    <a href="faq.html">faq</a>
    <a href="photos.html">photos</a>
  </nav>

  <section>
    <div class="label">socials</div>
    <div class="kv-list">
      <a class="kv-row" href="https://github.com/jxherc" target="_blank" rel="noopener">
        <span class="k">github</span><span class="v">jxherc</span>
      </a>
      <a class="kv-row" href="https://instagram.com/houjingxing" target="_blank" rel="noopener">
        <span class="k">instagram</span><span class="v">@houjingxing</span>
      </a>
      <a class="kv-row" href="https://twitter.com/jxherc" target="_blank" rel="noopener">
        <span class="k">twitter</span><span class="v">@jxherc</span>
      </a>
    </div>
  </section>

  <section class="page-edit-stamp"></section>

</main>

<script>
  const BIRTH = new Date('2010-01-03T11:30:00Z');
  const ageSpot = document.getElementById('age');
  function updateAge() {
    const years = (new Date() - BIRTH) / (1000 * 60 * 60 * 24 * 365.25);
    ageSpot.textContent = years.toFixed(8) + ' years';
  }
  updateAge();
  setInterval(updateAge, 40);

  const clockSpot = document.getElementById('clock');
  function updateClock() {
    const time = new Date().toLocaleTimeString('en-CA', {
      timeZone: 'America/Toronto',
      hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    clockSpot.textContent = time + ' toronto (et)';
  }
  updateClock();
  setInterval(updateClock, 1000);

  fetch('https://api.github.com/repos/jxherc/website/commits?path=index.html&per_page=1')
    .then(r => r.json())
  .then(data => {
      const c = data[0]?.commit;
      if (!c) return;
      const d = new Date(c.committer?.date || c.author?.date);
      if (isNaN(d)) return;
      const date = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }).toLowerCase();
      document.querySelector('.page-edit-stamp').textContent = 'updated ' + date;
    }).catch(() => {});
</script>
</body>
</html>
