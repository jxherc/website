<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta property="og:title" content="faq — jxherc">

</head>
<body>
<main>
  <a class="home" href="index.html">jxherc</a>
  <section>
    <div class="label">faq</div>
    <div class="kv-list">
      <div class="kv-row"><span class="k">age</span><span class="v" id="age-val">—</span></div>
      <div class="kv-row"><span class="k">birthday</span><span class="v">01/03/2010</span></div>
      <div class="kv-row"><span class="k">from</span><span class="v">shenzhen china</span></div>
      <div class="kv-row"><span class="k">height</span><span class="v">168cm</span></div>
      <div class="kv-row"><span class="k">ethnicity</span><span class="v">chinese</span></div>
      <div class="kv-row"><span class="k">mbti</span><span class="v">isfp-a</span></div>
      <div class="kv-row"><span class="k">orientation</span><span class="v">straight</span></div>
      <div class="kv-row"><span class="k">why this site</span><span class="v">personal interest</span></div>
      <a class="kv-row" href="https://jxherc.com/gbp" target="_blank" rel="noopener">
        <span class="k">contact</span><span class="v">discord</span>
      </a>
    </div>
  </section>
  <section class="page-edit-stamp" id="edit-stamp"></section>
</main>
<script>
const BIRTH = new Date('2010-01-03');
const age = Math.floor((Date.now() - BIRTH) / (365.25 * 24 * 60 * 60 * 1000));
document.getElementById('age-val').textContent = age;

fetch('https://api.github.com/repos/jxherc/website/commits?path=faq.html&per_page=1')
  .then(r => r.json())
  .then(data => {
    const hit = data[0]?.commit;
    if (!hit) return;
    const d = new Date(hit.committer?.date || hit.author?.date);
    if (isNaN(d)) return;
    const when = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }).toLowerCase();
    document.getElementById('edit-stamp').textContent = 'updated ' + when;
  })
  .catch(() => {});
</script>
</body>
</html>
